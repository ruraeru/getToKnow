spring.application.name=backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:gettoknow}
spring.datasource.username=${DB_USER:gettoknow}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Boot 4 name; the old server.error.include-message is silently ignored
spring.web.error.include-message=always

# HS256 needs at least 32 bytes
app.jwt-secret=${JWT_SECRET}
app.cors-origin=${CORS_ORIGIN:http://localhost:3000}
